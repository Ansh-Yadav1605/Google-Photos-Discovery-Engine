services:
  - type: web
    name: google-photos-discovery-engine
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn src.api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
